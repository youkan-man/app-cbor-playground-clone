services:
  cbor:
    build: .
    ports:
      - "${CBOR_PORT:-8080}:8080"
    environment:
      CBOR_MAX_BYTES: ${CBOR_MAX_BYTES:-262144}
    volumes:
      - cbor-history:/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  cbor-history:
